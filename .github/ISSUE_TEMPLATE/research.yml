name: 조사·문서 작업
description: 사용자 조사, 경쟁 분석, 요구사항과 설계 문서 작업
title: "docs: "
labels: ["research", "documentation"]
body:
  - type: textarea
    id: question
    attributes:
      label: 확인할 질문 또는 가설
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 필요한 증거
      description: 표본, 비교 대상, 출처와 판단 기준을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: 산출물과 완료 조건
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 개인정보·데이터 처리
      description: 익명화, 제외 기준, 보관 범위와 공개 가능한 증빙을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 사람 작업과 외부 의존성

      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수정 완료 조건과 회귀 검사
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 개인정보를 제거한 증빙
